<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOUSELY | SNS投稿作成</title><style>body{margin:0;background:#f4f7f5;color:#172b27;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}main{max-width:560px;margin:auto;padding:24px 18px}header{background:#133c32;color:white;padding:24px;border-radius:20px;margin-bottom:20px}h1{margin:0;font-size:32px;letter-spacing:2px}p{line-height:1.6}.card{background:white;padding:20px;border-radius:18px;box-shadow:0 4px 20px #18372b10}label{display:block;margin:16px 0 7px;font-weight:700}input,select,textarea{box-sizing:border-box;width:100%;border:1px solid #b9c9c3;border-radius:10px;padding:13px;font:inherit}textarea{min-height:95px}button{border:0;background:#17795b;color:white;padding:15px;border-radius:12px;width:100%;font-weight:700;font-size:16px;margin-top:18px}button.secondary{background:#e3f0e9;color:#16513e}#result{white-space:pre-wrap;background:#f0f6f2;padding:16px;border-radius:12px;margin-top:16px;line-height:1.8;display:none}small{color:#60756c}</style></head><body><main><header><h1>HOUSELY 🏠</h1><p>住宅会社・工務店向け SNS投稿作成サポート</p></header><div class="card"><label for="company">会社名</label><input id="company" placeholder="例：ハウスリー工務店"><label for="kind">施工の種類</label><select id="kind"><option>新築注文住宅</option><option>リフォーム</option><option>リノベーション</option><option>外壁塗装</option></select><label for="feature">施工の特徴</label><textarea id="feature" placeholder="例：木のぬくもりを感じる明るいリビング"></textarea><button id="generate" type="button">投稿文を作成する</button><div id="result" aria-live="polite"></div><button id="copy" type="button" class="secondary" style="display:none">投稿文をコピー</button><small>無料試作品：入力内容をもとにテンプレートで文章を作成します。AI APIには接続していません。</small></div></main><script>const $=id=>document.getElementById(id);let last='';$('generate').addEventListener('click',()=>{let company=$('company').value.trim()||'私たち';let kind=$('kind').value;let feature=$('feature').value.trim()||'暮らしやすさにこだわった住まい';last=`🏠【${company}の施工事例】\n\n今回ご紹介するのは、${kind}。\n\n注目ポイントは「${feature}」です。\n\n理想のお住まいについて、ぜひコメントで教えてください✨\n\n#家づくり #施工事例 #マイホーム`; $('result').textContent=last;$('result').style.display='block';$('copy').style.display='block';$('result').scrollIntoView({behavior:'smooth',block:'nearest'});});$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(last);$('copy').textContent='コピーしました！'}catch(e){$('copy').textContent='文章を長押ししてコピーしてね';}});</script></body></html>
